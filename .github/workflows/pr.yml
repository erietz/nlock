name: Pull Request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.5"

      - name: Check code formatting
        run: zig fmt --check .

      - name: Build with man pages
        run: zig build install man

      - name: Run unit tests
        run: zig build test

      - name: Run integration tests
        run: zig build test-integration
