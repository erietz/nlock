[tools]
zig = "0.17.0"
zls = "0.17.0"
pandoc = "3.12"
nfpm = "2.47.0"

[tasks.build]
run = "zig build"

[tasks."build:cross"]
description = "Cross-compile for macOS and Linux on x86_64 and aarch64"
run = """
set -euo pipefail
targets=(
  "aarch64-macos"
  "x86_64-macos"
  "aarch64-linux"
  "x86_64-linux"
)
for target in "${targets[@]}"; do
  echo "Building $target..."
  if [[ "$target" == *linux* ]]; then
    zig build install man -Dtarget="$target" -Doptimize=ReleaseSafe -Dservice-bindir=/usr/bin --prefix "dist/$target"
  else
    zig build install man -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "dist/$target"
  fi
done
"""

[tasks."package:deb"]
description = "Build Debian (.deb) packages for x86_64 and aarch64"
depends = ["build:cross"]
run = """
set -euo pipefail
VERSION="${NLOCK_VERSION:-$(sed -n 's/.*\\.version = "\\(.*\\)".*/\\1/p' build.zig.zon)}"
mkdir -p dist
for arch in amd64 arm64; do
  target_dir="dist/x86_64-linux"
  if [ "$arch" = "arm64" ]; then
    target_dir="dist/aarch64-linux"
  fi
  echo "Packaging deb for $arch (version $VERSION)..."
  ARCH="$arch" VERSION="$VERSION" TARGET_DIR="$target_dir" nfpm package --config nfpm.yaml --packager deb --target dist/
done
"""

[tasks."package:arch"]
description = "Build Arch Linux (.pkg.tar.zst) packages for x86_64 and aarch64"
depends = ["build:cross"]
run = """
set -euo pipefail
VERSION="${NLOCK_VERSION:-$(sed -n 's/.*\\.version = "\\(.*\\)".*/\\1/p' build.zig.zon)}"
mkdir -p dist
for arch in amd64 arm64; do
  target_dir="dist/x86_64-linux"
  if [ "$arch" = "arm64" ]; then
    target_dir="dist/aarch64-linux"
  fi
  echo "Packaging archlinux for $arch (version $VERSION)..."
  ARCH="$arch" VERSION="$VERSION" TARGET_DIR="$target_dir" nfpm package --config nfpm.yaml --packager archlinux --target dist/
done
"""

[tasks."package"]
description = "Build Debian (.deb) and Arch Linux (.pkg.tar.zst) packages"
depends = ["package:deb", "package:arch"]


[tasks."test:unit"]
run = "zig build test"

[tasks."test:integration"]
run = "zig build test-integration"

[tasks."test"]
depends = ["test:unit", "test:integration"]

[tasks."test:tmux"]
depends = "test"
env.COMMAND = "sh -c 'echo testing && sleep 3'"
env.NLOCK_LOG_LEVEL = "debug"
run = "./tmux_tests.sh"

[tasks."install"]
env.PREFIX = "$HOME/.local"
run = 'zig build install man --prefix {{ env.PREFIX }}'

[tasks."uninstall"]
env.PREFIX = "$HOME/.local"
# run = "zig build uninstall --prefix {{ env.PREFIX }}" # Broken with a todo reference to GH issue
run = """
set -eoux pipefail
rm -f {{ env.PREFIX }}/bin/nlock
rm -f {{ env.PREFIX }}/bin/nlockd
rm -rf {{ env.PREFIX }}/share/nlock
rm -f {{ env.PREFIX }}/share/man/man1/nlock.1
rm -f {{ env.PREFIX }}/share/man/man1/nlockd.1
"""

[tasks."daemon-launchd-user-start"]
env.PREFIX = "$HOME/.local"
depends = [
	{ task = "install", env = { PREFIX = "$HOME/.local" } },
]
run = """
set -eoux pipefail
launchctl bootout gui/$(id -u)/com.erietz.nlockd || true
cp "{{ env.PREFIX }}/share/nlock/launchd/com.erietz.nlockd.plist" ~/Library/LaunchAgents/
launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.erietz.nlockd.plist
launchctl print gui/$(id -u)/com.erietz.nlockd
echo "check the logs via: log stream --style compact --process nlockd --level debug"
"""

[tasks."daemon-launchd-user-stop"]
env.PREFIX = "$HOME/.local"
run = """
set -eoux pipefail
launchctl bootout gui/$(id -u)/com.erietz.nlockd
echo "optionally clean up the plist file -> rm ~/Library/LaunchAgents/com.erietz.nlockd.plist"
"""

[tasks."daemon-systemd-user-start"]
env.PREFIX = "$HOME/.local"
run = """
set -eoux pipefail
systemctl --user daemon-reload
systemctl --user enable --now nlockd
systemctl --user status nlockd
echo "check the logs via: journalctl --user-unit nlockd -f"
"""

[tasks."daemon-systemd-user-stop"]
env.PREFIX = "$HOME/.local"
run = """
set -eoux pipefail
systemctl --user disable --now nlockd
systemctl --user daemon-reload
"""
