[tools]
zig = "0.16.0"
zls = "0.16.0"

[tasks.build]
run = "zig build"

[tasks."test:unit"]
run = "zig build test"

[tasks."test:integration"]
run = "zig build test-integration"

[tasks."test"]
depends = ["test:unit", "test:integration"]

[tasks."test:tmux"]
depends = "test"
env.COMMAND = "sh -c 'echo testing && sleep 3'"
env.NLOCK_LOG_LEVEL = "Debug"
run = "./tmux_tests.sh"

[tasks."install"]
vars.PREFIX = "$HOME/.local"
run = 'zig build install --prefix {{ vars.PREFIX }}'

[tasks."uninstall"]
vars.PREFIX = "$HOME/.local"
# run = "zig build uninstall --prefix {{ vars.PREFIX }}" # Broken with a todo reference to GH issue
run = """
rm -rf {{ vars.PREFIX }}/bin/nlock
rm -rf {{ vars.PREFIX }}/bin/nlockd
rm -rf {{ vars.PREFIX }}/share/nlock
rm -rf {{ vars.PREFIX }}/share/man/man1/nlock.1
rm -rf {{ vars.PREFIX }}/share/man/man1/nlockd.1
"""

[tasks."daemon-macos-user-start"]
env.PREFIX = "$HOME/.local"
run = """
zig build install --prefix "${PREFIX}"
launchctl bootout gui/$(id -u)/com.erietz.nlockd
cp "${PREFIX}/share/nlock/launchd/com.erietz.nlockd.plist" ~/Library/LaunchAgents/
launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.erietz.nlockd.plist
launchctl print gui/$(id -u)/com.erietz.nlockd
echo "check the logs via: log stream --style compact --process nlockd --level debug"
"""

[tasks."daemon-macos-user-stop"]
env.PREFIX = "$HOME/.local"
run = """
launchctl bootout gui/$(id -u)/com.erietz.nlockd
# rm ~/Library/LaunchAgents/com.erietz.nlockd.plist
"""
