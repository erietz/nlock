# Minimal tmux setup for demo.tape: no status bar, clean prompt in every pane.
set -g status off
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour141
set -g default-command "env -i HOME=$HOME PATH=$PATH TERM=$TERM INPUTRC=/dev/null PS1='\\[\\e[1;35m\\]❯\\[\\e[0m\\] ' bash --norc --noprofile"
